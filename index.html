  <style>
    :root {
      --bg: #030303;
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-hover: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.07);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.3);
      --text-main: #ffffff;
      --text-dim: #94a3b8;
      --success: #22c55e;
      --success-border: rgba(34, 197, 94, 0.3);
      --warning: #f59e0b;
      --muted: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.05) 0%, transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.05) 0%, transparent 35%);
      line-height: 1.6;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .center-wrapper { display: flex; justify-content: center; width: 100%; }

    .hire-status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 24px;
      border-radius: 100px;
      background: rgba(34, 197, 94, 0.05);
      border: 1px solid var(--success-border);
      margin: 20px auto 32px;
      font-weight: 600;
      color: var(--success);
      font-size: 0.95rem;
    }
    .hire-status i { width: 18px; height: 18px; }

    header { margin-bottom: 48px; text-align: center; animation: fadeIn 0.8s ease; }

    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(2.2rem, 8vw, 3.8rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    h1 span { color: var(--accent); }

    .hero-title {
      color: var(--text-main);
      font-size: clamp(1rem, 3vw, 1.15rem);
      font-weight: 600;
      margin-bottom: 16px;
    }

    .hero-desc {
      color: var(--text-dim);
      font-size: clamp(0.95rem, 2.5vw, 1.05rem);
      max-width: 680px;
      margin: 0 auto 28px;
    }

    .metrics-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 24px;
      min-width: 140px;
      text-align: center;
    }
    .metric-card .value {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
    }
    .metric-card .label {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .cta-btn {
      padding: 14px 28px;
      border-radius: 14px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.3s;
      font-size: 0.95rem;
    }
    .cta-btn.primary { background: var(--accent); color: #fff; box-shadow: 0 8px 20px var(--accent-glow); }
    .cta-btn.primary:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .cta-btn.secondary { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; }
    .cta-btn.secondary:hover { background: rgba(255,255,255,0.1); }

    .status-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 16px; }
    .status-badges img { height: 26px; border-radius: 4px; }

    .section-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.35rem;
      margin: 48px 0 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-title span { flex-grow: 1; height: 1px; background: var(--border); }

    .tabs-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .tabs-nav::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s ease;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tab-btn i { width: 16px; height: 16px; }
    .tab-btn:hover { background: var(--card-hover); color: var(--text-main); }
    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      transition: opacity 0.3s ease;
    }

    .projects-grid.featured {
      grid-template-columns: repeat(3, 1fr);
      margin-bottom: 8px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      transition: all 0.35s ease;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .card.hidden { display: none; }
    .card.featured { border-color: rgba(59, 130, 246, 0.25); }
    .card:hover { border-color: var(--accent); background: var(--card-hover); transform: translateY(-3px); box-shadow: 0 10px 30px -10px var(--accent-glow); }

    .card h3 {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h3 i { width: 14px; height: 14px; color: var(--accent); }

    .card .title { font-size: 1.15rem; font-weight: 700; margin-bottom: 10px; line-height: 1.3; }
    .card .desc { font-size: 0.9rem; color: var(--text-dim); line-height: 1.5; margin-bottom: 14px; flex-grow: 1; }
    .stack-info { font-size: 0.72rem; font-weight: 600; color: var(--accent); margin-bottom: 16px; display: block; }

    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; gap: 8px; flex-wrap: wrap; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .status-badge.live { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.25); }
    .status-badge.private { background: rgba(100, 116, 139, 0.15); color: var(--muted); border: 1px solid rgba(100, 116, 139, 0.3); }
    .status-badge.archived { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.25); }

    .repo-link {
      display: inline-flex;
      text-decoration: none;
    }
    .repo-link img { height: 26px; border-radius: 4px; }

    .timeline { position: relative; padding-left: 24px; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 5px;
      top: 8px;
      bottom: 8px;
      width: 1px;
      background: var(--border);
    }
    .timeline-item { position: relative; margin-bottom: 28px; }
    .timeline-item:last-child { margin-bottom: 0; }
    .timeline-dot {
      position: absolute;
      left: -24px;
      top: 6px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
    }
    .timeline-date { font-size: 0.82rem; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
    .timeline-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
    .timeline-desc { font-size: 0.88rem; color: var(--text-dim); line-height: 1.5; }
    .growth-badge {
      display: inline-flex;
      padding: 2px 8px;
      background: rgba(34, 197, 94, 0.1);
      color: var(--success);
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      margin-left: 6px;
      margin-top: 4px;
    }

    .exp-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
    }

    .credentials-line {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-top: 16px;
    }

    .contact-cta {
      background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.1), transparent), var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 48px 32px;
      text-align: center;
      margin: 56px 0 40px;
    }
    .contact-cta h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 2rem; font-weight: 800; margin-bottom: 12px; }
    .contact-cta p { color: var(--text-dim); margin-bottom: 28px; }
    .contact-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    footer {
      margin-top: 32px;
      padding: 32px 0;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .loading { text-align: center; color: var(--text-dim); padding: 60px 0; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 900px) {
      .projects-grid, .projects-grid.featured { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .projects-grid, .projects-grid.featured { grid-template-columns: 1fr; }
      .contact-cta { padding: 36px 20px; }
      .contact-cta h2 { font-size: 1.6rem; }
    }
  </style>
</head>

<script>
  const STATUS_LABELS = {
    live: 'Live',
    private: 'Private • demo on interview',
    archived: 'Archived'
  };

  function renderStatusBadge(status) {
    const label = STATUS_LABELS[status] || status;
    return `<span class="status-badge ${status}">${label}</span>`;
  }

  function renderRepoLink(project) {
    if (project.repoUrl) {
      return `<a href="${project.repoUrl}" target="_blank" rel="noopener" class="repo-link">
        <img src="https://img.shields.io/badge/VIEW_REPO-181717?style=for-the-badge&logo=github" alt="View repo" />
      </a>`;
    }
    return '';
  }

  function renderCard(project, featured = false) {
    return `
      <article class="card${featured ? ' featured' : ''}" data-category="${project.category}" data-id="${project.id}">
        <div>
          <h3><i data-lucide="${project.icon}"></i> ${project.type}</h3>
          <div class="title">${project.title}</div>
          <div class="desc">${project.desc}</div>
          <span class="stack-info">${project.stack}</span>
        </div>
        <div class="card-footer">
          ${renderStatusBadge(project.status)}
          ${renderRepoLink(project)}
        </div>
      </article>
    `;
  }

  function renderExperience(items) {
    return items.map((item, i) => `
      <div class="timeline-item">
        <div class="timeline-dot" style="${i > 0 ? 'background: var(--text-dim);' : ''}"></div>
        <div class="timeline-date" style="${i > 0 ? 'color: var(--text-dim);' : ''}">${item.period}</div>
        <div class="timeline-title">${item.title}</div>
        <div class="timeline-desc">
          ${item.desc}
          ${(item.highlights || []).map(h => `<span class="growth-badge">${h}</span>`).join('')}
        </div>
      </div>
    `).join('');
  }

  function renderPage(profile, projects) {
    const featured = projects.filter(p => p.featured);
    const all = projects;

    document.title = profile.site.title;
    document.querySelector('meta[name="description"]').content = profile.site.description;
    document.querySelector('meta[property="og:title"]').content = profile.site.title;
    document.querySelector('meta[property="og:description"]').content = profile.site.description;

    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="center-wrapper">
        <div class="hire-status"><i data-lucide="check-circle-2"></i> ${profile.hireStatus}</div>
      </div>

      <header>
        <h1>Сергей <span>${profile.nameHighlight}</span></h1>
        <p class="hero-title">${profile.title}</p>
        <p class="hero-desc">${profile.tagline}</p>

        <div class="metrics-row">
          ${profile.metrics.map(m => `
            <div class="metric-card">
              <div class="value">${m.value}</div>
              <div class="label">${m.label}</div>
            </div>
          `).join('')}
        </div>

        <div class="hero-actions">
          <a href="#cases" class="cta-btn primary"><i data-lucide="folder-open"></i> Смотреть кейсы</a>
          <a href="${profile.contacts.telegram}" target="_blank" rel="noopener" class="cta-btn secondary"><i data-lucide="send"></i> Telegram</a>
        </div>

        <div class="status-badges">
          ${profile.badges.map(b => `<img src="${b}" alt="" />`).join('')}
        </div>
        <div style="display:flex;justify-content:center;margin-top:12px;">
          <img src="${profile.skills}" alt="Skills" />
        </div>
      </header>

      <div class="section-title"><span></span> Featured Cases <span></span></div>
      <div class="projects-grid featured" id="featured-grid">
        ${featured.map(p => renderCard(p, true)).join('')}
      </div>

      <div class="section-title" id="cases"><span></span> Все кейсы <span></span></div>
      <div class="tabs-nav">
        <button class="tab-btn active" data-filter="all"><i data-lucide="layout-grid"></i> Все</button>
        <button class="tab-btn" data-filter="ai"><i data-lucide="zap"></i> AI & Automation</button>
      </div>
      <div class="projects-grid" id="projects-grid">
        ${all.map(p => renderCard(p)).join('')}
      </div>

      <div class="section-title"><span></span> Опыт <span></span></div>
      <div class="exp-box">
        <div class="timeline">${renderExperience(profile.experience)}</div>
      </div>
      <p class="credentials-line">${profile.credentials}</p>

      <div class="contact-cta">
        <h2>Давайте автоматизируем ваш процесс</h2>
        <p>Ищете архитектора для AI-агентов или automation-пайплайнов? Я на связи.</p>
        <div class="contact-buttons">
          <a href="${profile.contacts.telegram}" target="_blank" rel="noopener" class="cta-btn primary"><i data-lucide="send"></i> Telegram</a>
          <a href="${profile.contacts.email}" class="cta-btn secondary"><i data-lucide="mail"></i> Email</a>
          <a href="${profile.contacts.github}" target="_blank" rel="noopener" class="cta-btn secondary"><i data-lucide="github"></i> GitHub</a>
        </div>
      </div>

      <footer>
        <p>© 2026 ${profile.name} • ${profile.title}</p>
      </footer>
    `;

    lucide.createIcons();
    initFilters();
  }

  function initFilters() {
    const filterButtons = document.querySelectorAll('.tab-btn');
    const projectCards = document.querySelectorAll('#projects-grid .card');
    const grid = document.getElementById('projects-grid');

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        filterButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        const filterValue = button.getAttribute('data-filter');
        grid.style.opacity = '0';
        setTimeout(() => {
          projectCards.forEach(card => {
            const category = card.getAttribute('data-category');
            if (filterValue === 'all' || category === filterValue) {
              card.classList.remove('hidden');
            } else {
              card.classList.add('hidden');
            }
          });
          grid.style.opacity = '1';
        }, 200);
      });
    });
  }

  async function loadJson(url, fallbackId) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch {
      const el = document.getElementById(fallbackId);
      if (el) return JSON.parse(el.textContent);
      throw new Error(`No data for ${url}`);
    }
  }

  async function init() {
    try {
      const profile = await loadJson('./data/profile.json', 'profile-data');
      const projectsData = await loadJson('./data/projects.json', 'projects-data');
      const projects = projectsData.projects || projectsData;
      renderPage(profile, projects);
    } catch (err) {
      document.getElementById('app').innerHTML = '<p class="loading">Не удалось загрузить данные. Запустите: <code>./serve.sh</code></p>';
      console.error(err);
    }
  }

  init();
</script>
</body>
</html>
